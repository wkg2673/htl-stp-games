
name: Sync with upstream games

on:
  schedule:
    - cron: "14 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Backup protected files and directories
          cp astro.config.mjs /tmp/astro-config-backup
          cp README.md /tmp/readme-backup
          cp CONTRIBUTING.md /tmp/contrib-backup
          cp src/assets/contributors /tmp/contributors-backup
          cp -a .github /tmp/github-backup

          # Fetch upstream
          git remote add upstream https://github.com/htl-stp/games.git
          git fetch upstream

          # Merge upstream changes
          git merge upstream/main -X theirs --no-edit

          # Restore protected files and directories
          cp /tmp/astro-config-backup astro.config.mjs
          cp /tmp/readme-backup README.md
          cp /tmp/contrib-backup CONTRIBUTING.md
          cp /tmp/contributors-backup src/assets/contributors
          rm -rf .github
          cp -a /tmp/github-backup .github

          # Commit protected files
          git add astro.config.mjs README.md CONTRIBUTING.md src/assets/contributors .github/
          git diff --cached --quiet || git commit -m "Preserve custom files and workflows"

          # Push changes
          git push origin HEAD:main
